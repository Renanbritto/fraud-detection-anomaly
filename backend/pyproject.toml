[project]
name = "sentinel-fraud-detection"
version = "1.0.0"
description = "Production-grade Anomaly Detection & Fraud Prevention System"
authors = [{ name = "Renan Nocelli", email = "renan.nocelli@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "torch>=2.2.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "polars>=1.0.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
