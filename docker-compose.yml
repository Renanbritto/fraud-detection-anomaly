version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Redis: In-memory sliding window feature store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sentinel-net

  # ----------------------------------------------------------------------------
  # Backend API & ML Inference Engine (FastAPI + PyTorch)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGINS=["http://localhost:3000"]
      - ISOLATION_FOREST_WEIGHT=0.55
      - AUTOENCODER_WEIGHT=0.45
      - DEFAULT_THRESHOLD=0.65
      - COST_FALSE_POSITIVE=15.0
      - COST_FALSE_NEGATIVE=3500.0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sentinel-net

  # ----------------------------------------------------------------------------
  # Frontend Dashboard (Next.js 15)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - sentinel-net

volumes:
  redis_data:

networks:
  sentinel-net:
    driver: bridge
